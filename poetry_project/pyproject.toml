[tool.poetry]
name = "poetry-project"
version = "0.1.0"
description = "Практика: окружения и зависимости"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
requests = "^2.34.2"
matplotlib = "^3.11.2"
pandas = "^3.0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]
dev = [
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]